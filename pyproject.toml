[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-cbpf"
dynamic = ["version"]                      # single-sourced from whisper_cbpf.__version__
description = "WHISPER-CBPF: easy, extensible Bayesian model comparison of astronomical transient light curves, on CPU or GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Phelipe Darc", email = "phelipedarc@gmail.com" }]
keywords = ["astronomy", "transients", "bayesian", "mcmc", "nested-sampling", "supernova", "kilonova", "tde", "jax", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
]

# Core deps cover data ingestion + plotting and the Whisper-owned samplers; they are all
# pure-Python / wheels (no compiler needed), with permissive bounds so installing never forces
# a numpy/scipy downgrade. `pip install whisper-cbpf` gives a working CPU package: it imports with
# NO jax, NO CUDA, NO torch and NO redback, and every GPU sampler/model still appears in
# list_samplers() / list_models() / list_distances() as available-requiring-an-extra.
# redback is OPTIONAL (physical models + priors, needs a C compiler for sncosmo); its strict
# numpy==1.26 / scipy<1.14 pins come from redback itself, not from here.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "emcee>=3.1",
    "dynesty>=2.0",
    "corner>=2.2",
    "tqdm",
]

[project.optional-dependencies]
models = ["redback>=1.12"]    # physical transient models + priors (also pulls bilby, sncosmo, afterglowpy)
svo = ["astroquery>=0.4.6"]   # SVO Filter Profile Service fallback for unknown bands
dev = ["pytest", "pytest-cov", "build", "astroquery>=0.4.6"]
sbi = ["sbi", "torch"]        # SNPE / NPE sampler (whisper_cbpf.samplers.snpe)
loo = ["arviz>=0.15"]         # PSIS-LOO / ELPD in predictive_metrics (degrades to None without it)

# The JAX/GPU half: nuts_gpu, abc_gpu, abc_smc_gpu, emcee_jax, the JAX models (kilonova, TDE, the
# twelve supernovae) and the *_jax distances. CUDA 12 is pinned because that is the platform this
# package is validated on; installing plain `jax` instead silently lands you on the CPU build,
# which is the single most expensive mistake here (~50x, no error). arviz comes along because the
# GPU-side metrics (ESS, ESS/sec) need it.
# Multi-GPU needs no further library: device selection is whisper_cbpf.backends.gpu_list() and the
# parallel path is NumPyro's own chain_method.
# NOTE: installing this extra is NOT sufficient on its own -- source scripts/whisper-gpu-env.sh
# before starting Python, or JAX will not see the GPU. See docs/GPU_SETUP.md.
gpu = ["jax[cuda12]>=0.4.30", "numpyro>=0.15", "arviz>=0.15"]
pymc = ["pymc>=5.16"]         # only the two pymc_jax_gpu_* frontends; imported lazily inside fit()

[project.urls]
Homepage = "https://github.com/phelipedarc/WHISPER-CBPF"
Repository = "https://github.com/phelipedarc/WHISPER-CBPF"
Documentation = "https://github.com/phelipedarc/WHISPER-CBPF/tree/main/docs"
Issues = "https://github.com/phelipedarc/WHISPER-CBPF/issues"
Changelog = "https://github.com/phelipedarc/WHISPER-CBPF/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "whisper_cbpf.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["whisper_cbpf*"]

[tool.setuptools.package-data]
whisper_cbpf = ["py.typed"]                # ship the typing marker so type hints reach consumers

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (e.g. SNPE neural-net training); deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["whisper_cbpf"]
omit = ["*/tests/*"]
